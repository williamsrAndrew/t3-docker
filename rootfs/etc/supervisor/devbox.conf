; Standalone supervisord config for the dev box (Debian's default config is not used).
; Services run as `dev`; logs go to the container's stdout (docker logs / TrueNAS app logs).
; Manage from a root shell:  supervisorctl status | restart t3code | restart ttyd

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:t3code]
; Runs T3 under its service launcher so the T3 apps can update it in place.
command=/usr/local/bin/devbox-t3
directory=/workspace
user=dev
; T3_SERVER_PORT is T3CODE_PORT, or an internal port when the login gate is in front.
environment=HOME="/home/dev",USER="dev",LOGNAME="dev",SHELL="/bin/bash",T3CODE_PORT="%(ENV_T3_SERVER_PORT)s"
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:login-gate]
; Username/password login in front of T3 Code; only runs when T3_LOGIN_PASSWORD is set.
command=/usr/local/bin/devbox-login-gate
user=dev
environment=HOME="/home/dev",USER="dev"
autostart=%(ENV_LOGIN_GATE_AUTOSTART)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:auto-update]
; Once T3 is up: install newer T3 Code / Claude Code / Codex releases into the
; home volume (AUTO_UPDATE=true), restarting T3 only if T3 itself changed.
command=/usr/local/bin/devbox-auto-update
user=root
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:t3-pair-hint]
; Once the server is healthy, print a pairing link to the logs if nothing is paired yet.
command=/bin/bash -c 'for i in $(seq 120); do curl -fsS "http://127.0.0.1:${T3CODE_PORT}/health" >/dev/null 2>&1 && exec /usr/local/bin/t3-pair --if-unpaired; sleep 2; done'
user=dev
environment=HOME="/home/dev",USER="dev"
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ttyd]
command=/usr/local/bin/devbox-ttyd
directory=/workspace
user=dev
environment=HOME="/home/dev",USER="dev",LOGNAME="dev",SHELL="/bin/bash",TERM="xterm-256color"
autostart=%(ENV_TTYD_AUTOSTART)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "deploy/**"]
  pull_request:
  # Weekly rebuild picks up new Claude Code / Codex / T3 Code / security releases.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      t3code_version:
        description: "Pin a T3 Code version (blank = latest stable)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Add linux/arm64 here if you ever need it (slower: built under QEMU).
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            T3CODE_VERSION=${{ inputs.t3code_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Weekly builds must not reuse cached layers, or the CLIs never update.
          no-cache: ${{ github.event_name == 'schedule' }}
